<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I Love You • Estelle ✨</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #1e0515 0%, #0d020a 60%, #050105 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #fff;
      touch-action: manipulation;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Crisp Ambient Backdrop Glow */
    .glow-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.2) 0%, rgba(225, 29, 72, 0.08) 50%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(30px);
      animation: ambientPulse 4s infinite ease-in-out;
    }

    @keyframes ambientPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* Floating Header Overlay */
    .header-message {
      position: absolute;
      top: 35px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 0 15px;
    }

    .header-message h1 {
      font-family: 'Sacramento', cursive;
      font-size: 3.8rem;
      color: #ffffff;
      text-shadow: 0 0 10px #f43f5e, 0 0 20px #e11d48, 0 0 30px #be123c;
      line-height: 1.1;
      letter-spacing: 1px;
    }

    .header-message p {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fda4af;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-top: 4px;
    }

    /* Bottom Controls & Prompts */
    .footer-prompt {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .tap-hint {
      font-size: 0.8rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(225, 29, 72, 0.25);
      padding: 7px 20px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(254, 205, 211, 0.4);
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.3);
      animation: bounceHint 2s infinite ease-in-out;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    @keyframes bounceHint {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .controls-group {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      background: rgba(15, 5, 12, 0.7);
      border: 1px solid rgba(253, 164, 175, 0.4);
      color: #ffffff;
      font-weight: 600;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.78rem;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .btn-action:hover, .btn-action:active {
      background: rgba(244, 63, 94, 0.8);
      border-color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
    }
  </style>
</head>
<body>

  <!-- Background Ambient Glow -->
  <div class="glow-overlay"></div>

  <!-- Main Particle Canvas -->
  <canvas id="heartCanvas"></canvas>

  <!-- Title Header -->
  <div class="header-message">
    <h1>I Love You, Estelle</h1>
    <p>Every word belongs to you ✨</p>
  </div>

  <!-- Interactive Footer Prompt -->
  <div class="footer-prompt">
    <div class="tap-hint">✨ Tap anywhere for crisp text bursts ✨</div>
    <div class="controls-group">
      <button class="btn-action" onclick="toggleAudio()">🎵 Ambient Chimes: <span id="audioState">OFF</span></button>
      <button class="btn-action" onclick="rebloomHeart()">💖 Re-Bloom</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // High-Contrast Crisp Colors
    const phrases = ["I Love You", "Te Amo", "Je t'aime", "Forever & Always", "Estelle", "My Heart", "Ti Amo", "愛してる", "💖"];
    const colors = [
      "#ffffff", // Ultra Crisp White
      "#ffe4e6", // Soft White Rose
      "#fda4af", // Bright Rose Pink
      "#f43f5e", // Electric Coral Red
      "#fb7185", // Vivid Pink
      "#fecdd3", // Warm Cream Pink
      "#fde047"  // Radiant Gold Accent
    ];

    // Parametric Heart Equation Coordinates
    function getHeartPoint(t, scale = 16) {
      const x = scale * 16 * Math.pow(Math.sin(t), 3);
      const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      return { x, y };
    }

    // Particle Class for Blooming Heart
    class HeartParticle {
      constructor(targetX, targetY, scaleFactor) {
        this.targetX = targetX;
        this.targetY = targetY;
        this.scaleFactor = scaleFactor;
        
        this.currentX = width / 2;
        this.currentY = height / 2;
        
        this.phrase = phrases[Math.floor(Math.random() * phrases.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        
        // Crisp, legible font sizing
        this.fontSize = Math.floor(Math.random() * 6 + 11); // 11px - 17px
        
        this.alpha = 0;
        this.progress = 0;
        this.speed = Math.random() * 0.018 + 0.01; // Smooth bloom speed
        
        this.angle = Math.atan2(targetY, targetX);
        this.distance = Math.hypot(targetX, targetY);
        this.pulseOffset = Math.random() * Math.PI * 2;
      }

      update(time, pulseFactor) {
        if (this.progress < 1) {
          this.progress += this.speed;
          if (this.progress > 1) this.progress = 1;
        }

        // Cubic Easing Out
        const ease = 1 - Math.pow(1 - this.progress, 3);
        
        // Gentle Heart Pulse
        const pulse = Math.sin(time * 0.003 + this.pulseOffset) * 3 * pulseFactor;
        const currentDistance = (this.distance + pulse) * ease;
        
        this.currentX = width / 2 + Math.cos(this.angle) * currentDistance;
        this.currentY = height / 2 + Math.sin(this.angle) * currentDistance;
        
        // High opacity for maximum clarity
        this.alpha = ease * (0.85 + Math.sin(time * 0.004 + this.pulseOffset) * 0.15);
      }

      draw() {
        ctx.save();
        ctx.translate(this.currentX, this.currentY);
        
        // Ultra-sharp rendering setup
        ctx.font = `700 ${this.fontSize}px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
        
        // Sharp high-contrast drop shadow instead of blurry glow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 2;
        
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.phrase, 0, 0);
        ctx.restore();
      }
    }

    // Floating Stardust Particles
    class Stardust {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 20;
        this.speedY = Math.random() * 0.7 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.phrase = phrases[Math.floor(Math.random() * phrases.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.fontSize = Math.floor(Math.random() * 4 + 9);
        this.opacity = Math.random() * 0.7 + 0.3;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.font = `600 ${this.fontSize}px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetY = 1;
        ctx.fillText(this.phrase, this.x, this.y);
        ctx.restore();
      }
    }

    // Interactive Tap Explosion Particle
    class ExplosionParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.phrase = phrases[Math.floor(Math.random() * phrases.length)];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.fontSize = Math.floor(Math.random() * 6 + 13);
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.96;
        this.vy *= 0.96;
        this.alpha -= this.decay;
      }
      draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.font = `700 ${this.fontSize}px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.shadowColor = 'rgba(0,0,0,0.95)';
        ctx.shadowBlur = 5;
        ctx.shadowOffsetY = 2;
        ctx.fillText(this.phrase, this.x, this.y);
        ctx.restore();
      }
    }

    // State Collections
    let heartParticles = [];
    let stardustList = [];
    let explosionList = [];

    function initHeart() {
      heartParticles = [];
      
      // Optimal particle count for perfect readability without clutter
      const particleCount = width < 600 ? 420 : 750;
      const baseScale = Math.min(width, height) / 36;

      for (let i = 0; i < particleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        const layerScale = Math.pow(Math.random(), 0.55); 
        const pt = getHeartPoint(t, baseScale * layerScale);
        
        heartParticles.push(new HeartParticle(pt.x, pt.y, layerScale));
      }
    }

    function initStardust() {
      stardustList = [];
      const count = width < 600 ? 25 : 45;
      for (let i = 0; i < count; i++) {
        stardustList.push(new Stardust());
      }
    }

    initHeart();
    initStardust();

    // Main Render Loop
    let startTime = Date.now();
    function animate() {
      const time = Date.now() - startTime;
      
      // Clear frame cleanly for crisp text rendering
      ctx.clearRect(0, 0, width, height);

      // Render Floating Stardust
      stardustList.forEach(s => {
        s.update();
        s.draw();
      });

      // Render Blooming Heart Particles
      heartParticles.forEach(p => {
        p.update(time, 1);
        p.draw();
      });

      // Render Tap Explosions
      for (let i = explosionList.length - 1; i >= 0; i--) {
        const exp = explosionList[i];
        exp.update();
        exp.draw();
        if (exp.alpha <= 0) explosionList.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Screen Tap Interaction
    window.addEventListener('pointerdown', (e) => {
      // Prevent button clicks from triggering explosion
      if (e.target.closest('.controls-group')) return;

      for (let i = 0; i < 14; i++) {
        explosionList.push(new ExplosionParticle(e.clientX, e.clientY));
      }

      if (audioCtx && isAudioPlaying) {
        playChimeSound();
      }
    });

    function rebloomHeart() {
      initHeart();
    }

    // Web Audio API Ambient Synthesizer
    let audioCtx = null;
    let isAudioPlaying = false;

    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      isAudioPlaying = !isAudioPlaying;
      document.getElementById('audioState').innerText = isAudioPlaying ? "ON 🎶" : "OFF";

      if (isAudioPlaying) {
        playChimeSound();
      }
    }

    function playChimeSound() {
      if (!audioCtx) return;
      
      const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C E G C E pentatonic
      const freq = freqs[Math.floor(Math.random() * freqs.length)];

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1.8);
    }
  </script>
</body>
</html>
